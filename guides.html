  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "CollectionPage",

  <style>
    .guides-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 740px;
      margin-top: 40px;
    }
    .guide-card-link {
      text-decoration: none;
      display: block;
    }
    .guide-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px 32px;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }
    .guide-card:hover {
      border-color: #f59e0b;
      background: #243044;
      transform: translateY(-2px);
    }
    .guide-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .guide-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f59e0b;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 4px;
      padding: 3px 10px;
    }
    .guide-read-time {
      font-size: 12px;
      color: #64748b;
    }
    .guide-card h2 {
      font-size: 18px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .guide-card p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .guide-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .guide-date { font-size: 12px; color: #475569; }
    .guide-arrow { font-size: 14px; color: #f59e0b; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-bar">
      <a href="/" class="brand">
        <img src="/assets/images/logo/coingyaan-logo-transparent.png" alt="CoinGyaan" loading="eager" />
        <div class="brand-text"><strong>CoinGyaan</strong></div>
      </a>
      <nav class="header-nav">
        <a href="/guides.html">Guides</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <img src="/assets/images/logo/owl-mascot.png" alt="CoinGyaan Mascot" class="owl-mascot" title="CoinGyaan Owl 🦉" loading="eager" />
    </div>
  </div>
</header>

<main class="container">

  <h1 class="page-title">Guides</h1>
  <p class="page-subtitle">Practical guides to help you learn, research and decide smarter.</p>

  <div class="guides-grid" id="guidesGrid"></div>

</main>

<footer>
  <div class="container">
    <div class="footer-promo"><p>🚀 Building useful crypto tools for traders and creators.</p></div>
    <div class="footer-links">
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <a href="/disclaimer.html">Disclaimer</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/advertise.html">Advertise</a>
    </div>
    <p class="footer-note">© <span id="year"></span> CoinGyaan.com</p>
  </div>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>

<!-- Load shared guides data first then render cards -->
<script src="/assets/js/guides-data.js"></script>
<script>
  var grid = document.getElementById('guidesGrid');
  GUIDES_DATA.forEach(function(g) {
    var html =
      '<a href="' + g.url + '" class="guide-card-link">' +
        '<div class="guide-card">' +
          '<div class="guide-card-top">' +
            '<span class="guide-tag">' + g.tag + '</span>' +
            '<span class="guide-read-time">' + g.readTime + '</span>' +
          '</div>' +
          '<h2>' + g.title + '</h2>' +
          '<p>' + g.desc + '</p>' +
          '<div class="guide-card-footer">' +
            '<span class="guide-date">' + g.date + '</span>' +
            '<span class="guide-arrow">Read Guide →</span>' +
          '</div>' +
        '</div>' +
      '</a>';
    grid.insertAdjacentHTML('beforeend', html);
  });
</script>

</body>
</html>
