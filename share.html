<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title id="pageTitle">Bitcoin Sentiment - CoinGyaan</title>
  <meta id="pageDescription" name="description" content="Check Bitcoin sentiment on CoinGyaan" />
  
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta id="ogTitle" property="og:title" content="Bitcoin Sentiment - CoinGyaan" />
  <meta id="ogDescription" property="og:description" content="Bitcoin is currently Bullish" />
  <meta property="og:url" content="https://coingyaan.com/" />
  <meta id="ogImage" property="og:image" content="https://coingyaan.com/og/sentiment?coin=Bitcoin&trend=bullish" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="675" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@coin_gyaan" />
  <meta id="twitterTitle" name="twitter:title" content="Bitcoin Sentiment" />
  <meta id="twitterDescription" name="twitter:description" content="Bitcoin is currently Bullish" />
  <meta id="twitterImage" name="twitter:image" content="https://coingyaan.com/og/sentiment?coin=Bitcoin&trend=bullish" />
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .container {
      text-align: center;
      padding: 40px;
      max-width: 600px;
    }
    
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #ffffff;
    }
    
    .sentiment {
      font-size: 4rem;
      font-weight: bold;
      margin: 30px 0;
    }
    
    .bullish { 
      color: #10b981; 
    }
    
    .bearish { 
      color: #ef4444; 
    }
    
    .neutral { 
      color: #94a3b8; 
    }
    
    .description {
      font-size: 1.2rem;
      color: #94a3b8;
      margin: 20px 0;
    }
    
    .btn {
      display: inline-block;
      padding: 15px 40px;
      background: #f7931a;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 30px;
      transition: transform 0.2s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      background: #ff6b00;
    }
    
    .redirect-info {
      margin-top: 40px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="coinName">Bitcoin</h1>
    <div id="sentimentBadge" class="sentiment bullish">BULLISH</div>
    <p class="description">Check crypto market sentiment on CoinGyaan</p>
    <a href="/" class="btn">Check More Cryptos</a>
    <p class="redirect-info">Redirecting to homepage in 3 seconds...</p>
  </div>

  <script>
    // Get URL parameters
    const params = new URLSearchParams(window.location.search);
    const coin = params.get('coin') || 'Bitcoin';
    const trend = params.get('trend') || 'neutral';
    
    // Update page content
    document.getElementById('coinName').textContent = coin;
    document.getElementById('sentimentBadge').textContent = trend.toUpperCase();
    document.getElementById('sentimentBadge').className = 'sentiment ' + trend;
    
    // Update meta tags for social sharing
    const titleText = `${coin} Sentiment - CoinGyaan`;
    const descText = `${coin} is currently ${trend.charAt(0).toUpperCase() + trend.slice(1)}`;
    const imageUrl = `https://coingyaan.com/og/sentiment?coin=${encodeURIComponent(coin)}&trend=${encodeURIComponent(trend)}`;
    
    // Update page title
    document.getElementById('pageTitle').textContent = titleText;
    
    // Update meta description
    document.getElementById('pageDescription').setAttribute('content', descText);
    
    // Update Open Graph tags
    document.getElementById('ogTitle').setAttribute('content', titleText);
    document.getElementById('ogDescription').setAttribute('content', descText);
    document.getElementById('ogImage').setAttribute('content', imageUrl);
    
    // Update Twitter tags
    document.getElementById('twitterTitle').setAttribute('content', titleText);
    document.getElementById('twitterDescription').setAttribute('content', descText);
    document.getElementById('twitterImage').setAttribute('content', imageUrl);
    
    // Auto-redirect to homepage after 3 seconds
    setTimeout(() => {
      window.location.href = '/';
    }, 3000);
  </script>
</body>
</html>
