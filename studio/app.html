<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CoinGyaan Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<script src="js/studio-config.js"></script>
<style>
:root{
  --bg:#0B0F14; --sidebar:#101722; --surface:#151C28; --hover:#1B2434;
  --border:#263346; --accent:#F97316; --accent-soft:rgba(249,115,22,.12);
  --ink:#F8FAFC; --muted:#94A3B8; --dim:#5B6B7F;
  --ok:#34D399; --ok-soft:rgba(52,211,153,.12);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:266px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.main{display:flex;flex-direction:column;min-width:0}
.content{flex:1;overflow-y:auto}
.content-inner{max-width:1080px;margin:0 auto;padding:34px 40px 60px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- sidebar ---------- */
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:11px}
.brand-mark{width:30px;height:30px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--hover)}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-weight:700;font-size:14.5px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13.5px;position:relative;transition:background .12s,color .12s}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item.active{background:var(--hover);color:var(--ink)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:17px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-badge{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--dim);border:1px solid var(--border);padding:1px 6px;border-radius:20px}
.nav-sep{height:1px;background:var(--border);margin:10px 14px}

.profile{margin-top:auto;padding:14px;border-top:1px solid var(--border)}
.profile-eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.profile-id{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:32px;height:32px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#F97316,#7C3AED)}
.profile-addr{font-family:var(--mono);font-size:12.5px;font-weight:500}
.profile-lvl{font-size:11.5px;color:var(--muted)}
.lvlbar{height:4px;background:var(--bg);border-radius:3px;overflow:hidden;margin:9px 0 12px}
.lvlbar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.pstat .k{font-size:11px;color:var(--dim)}
.pstat .v{font-size:14px;font-weight:600;font-family:var(--mono)}
.profile-empty{font-size:12.5px;color:var(--muted);line-height:1.55}
.profile-empty button{color:var(--accent);font-weight:600;margin-top:8px;font-size:12.5px}

/* ---------- topbar ---------- */
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:0 12px;height:34px;width:300px;color:var(--muted)}
.search svg{width:15px;height:15px}
.search input{background:none;border:none;outline:none;color:var(--ink);font-size:13px;width:100%}
.search input::placeholder{color:var(--dim)}
.search kbd{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-size:13px;font-weight:500;color:var(--ink);transition:background .12s}
.pill:hover{background:var(--hover)}
.pill svg{width:14px;height:14px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.wallet-chip{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px 0 8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-size:13px;transition:background .12s}
.wallet-chip:hover{background:var(--hover)}
.wallet-chip .avatar{width:20px;height:20px;border-radius:6px}
.wallet-chip .net{color:var(--dim);font-size:11.5px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 15px;border-radius:9px;font-weight:600;font-size:13.5px;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#0B0F14}
.btn-primary:hover{background:#fb8b3d}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--ink)}
.btn-secondary:hover{background:var(--hover)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--hover);color:var(--ink)}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}

/* ---------- typography / page ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.02em}
.page-sub{color:var(--muted);font-size:14px;margin-top:5px}
.sec-title{font-size:14px;font-weight:600;color:var(--ink)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}

/* ---------- cards / lists ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px}
.divider{height:1px;background:var(--border)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-pending{background:rgba(148,163,184,.1);color:var(--muted)}
.badge-soon{background:var(--accent-soft);color:var(--accent)}

/* GM */
.gm-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
.checkin{padding:6px}
.checkin-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:10px}
.checkin-row + .checkin-row{border-top:1px solid var(--border)}
.net-ic{width:34px;height:34px;border-radius:9px;background:var(--hover);display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.net-ic svg{width:17px;height:17px}
.checkin-name{font-weight:600;font-size:14px}
.checkin-meta{font-size:12px;color:var(--dim);margin-top:1px}
.xp-card{padding:18px}
.xp-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.xp-num{font-family:var(--mono);font-size:26px;font-weight:600}
.xp-num small{font-size:15px;color:var(--dim)}
.xp-bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.xp-bar > i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}
.xp-hint{font-size:12px;color:var(--dim);margin-top:11px}
.countdown-pill{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 14px}
.countdown-pill .t{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.02em}
.countdown-pill .l{font-size:11px;color:var(--dim)}

/* leaderboard */
.tabs{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px}
.tab{padding:5px 13px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted);transition:background .12s,color .12s}
.tab.active{background:var(--surface);color:var(--ink)}
.lb{width:100%;border-collapse:collapse;font-size:13px}
.lb th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:0 14px 11px}
.lb td{padding:11px 14px;border-top:1px solid var(--border)}
.lb tr.you td{background:var(--accent-soft)}
.lb .rank{font-family:var(--mono);color:var(--muted);width:44px}
.lb .w{font-family:var(--mono)}
.lb .xp{font-family:var(--mono);text-align:right}

/* two-panel */
.work{display:grid;grid-template-columns:264px 1fr;gap:22px;align-items:start}
.opt{display:flex;gap:12px;padding:13px;border-radius:11px;border:1px solid transparent;transition:background .12s,border-color .12s;text-align:left;width:100%}
.opt:hover{background:var(--surface)}
.opt.active{background:var(--surface);border-color:var(--border)}
.opt.active .opt-ic{background:var(--accent-soft);color:var(--accent)}
.opt-ic{width:34px;height:34px;border-radius:9px;background:var(--hover);display:grid;place-items:center;color:var(--muted);flex-shrink:0;transition:background .12s,color .12s}
.opt-ic svg{width:17px;height:17px}
.opt-t{font-weight:600;font-size:13.5px}
.opt-d{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.panel{padding:28px 30px}
.panel-head{margin-bottom:22px}
.panel-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.panel-sub{color:var(--muted);font-size:13px;margin-top:4px}

/* forms */
.field{margin-bottom:20px}
.field label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--ink);font-size:13.5px;outline:none;transition:border-color .12s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:76px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;padding:5px 11px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--muted);transition:all .12s}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* preview / success */
.review{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:18px}
.review-row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:13px}
.review-row + .review-row{border-top:1px solid var(--border)}
.review-row .k{color:var(--muted)}
.review-row .v{font-weight:500;max-width:60%;text-align:right;word-break:break-word}
.state{text-align:center;padding:30px 10px}
.state-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin:0 auto 16px}
.state-ic.ok{background:var(--ok-soft);color:var(--ok)}
.state-ic.load{background:var(--accent-soft);color:var(--accent)}
.state h4{font-size:17px;font-weight:700;margin-bottom:6px}
.state p{color:var(--muted);font-size:13px;max-width:340px;margin:0 auto}
.result{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-top:20px;text-align:left}
.result-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0}
.result-row .k{color:var(--muted)}
.result-row .v{font-family:var(--mono)}
.link{color:var(--accent);font-weight:500}
.spin{width:22px;height:22px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* explorer */
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.exp-card{padding:22px;position:relative;overflow:hidden}
.exp-ic{width:38px;height:38px;border-radius:10px;background:var(--hover);display:grid;place-items:center;color:var(--muted);margin-bottom:16px}
.exp-ic svg{width:19px;height:19px}
.exp-card h4{font-size:15px;font-weight:600;margin-bottom:5px}
.exp-card p{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:90%}
.exp-tag{position:absolute;top:18px;right:18px}

/* docs */
.docs{display:grid;grid-template-columns:210px 1fr;gap:26px;align-items:start}
.docs-nav{display:flex;flex-direction:column;gap:2px}
.docs-link{text-align:left;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--muted);transition:background .12s,color .12s}
.docs-link:hover{background:var(--surface);color:var(--ink)}
.docs-link.active{background:var(--surface);color:var(--ink);font-weight:500}
.docs-body h3{font-size:20px;font-weight:700;margin-bottom:12px}
.docs-body p{color:var(--muted);font-size:14px;margin-bottom:14px;max-width:640px}
.docs-body h4{font-size:14px;font-weight:600;margin:22px 0 8px}
.docs-body li{color:var(--muted);font-size:14px;margin:5px 0 5px 18px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,9,13,.62);display:grid;place-items:center;z-index:100;animation:ov .16s ease;padding:20px}
@keyframes ov{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:400px;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:20px 20px 4px}
.modal-title{font-size:16px;font-weight:700}
.modal-sub{font-size:13px;color:var(--muted);margin-top:3px}
.modal-body{padding:16px 18px 20px}
.wallet-opt{display:flex;align-items:center;gap:13px;padding:12px;border-radius:11px;width:100%;text-align:left;transition:background .12s}
.wallet-opt:hover{background:var(--hover)}
.wallet-opt + .wallet-opt{margin-top:4px}
.w-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.w-ic svg{width:20px;height:20px}
.w-name{font-weight:600;font-size:14px}
.w-desc{font-size:12px;color:var(--dim);margin-top:1px}
.w-arrow{margin-left:auto;color:var(--dim)}
.acct{display:flex;align-items:center;gap:12px;padding:13px;border-radius:11px;width:100%;text-align:left;transition:background .12s}
.acct:hover{background:var(--hover)}
.acct + .acct{border-top:1px solid var(--border)}
.acct .avatar{width:30px;height:30px;border-radius:8px}
.acct-a{font-family:var(--mono);font-size:13.5px;font-weight:500}
.acct-n{font-size:11.5px;color:var(--dim)}
.acct .w-arrow{margin-left:auto}

/* wallet dropdown */
.dropdown{position:absolute;top:52px;right:22px;width:248px;background:var(--surface);border:1px solid var(--border);border-radius:13px;z-index:120;overflow:hidden;animation:pop .16s ease;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.dd-head{padding:14px 15px}
.dd-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.dd-id{display:flex;align-items:center;gap:10px}
.dd-id .avatar{width:30px;height:30px;border-radius:8px}
.dd-a{font-family:var(--mono);font-size:13px;font-weight:500}
.dd-n{font-size:11.5px;color:var(--dim)}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 15px;width:100%;text-align:left;font-size:13px;color:var(--muted);transition:background .12s,color .12s}
.dd-item:hover{background:var(--hover);color:var(--ink)}
.dd-item svg{width:15px;height:15px}
.dd-item.danger:hover{color:#F87171}

/* net menu */
.netmenu{position:absolute;top:52px;width:230px;background:var(--surface);border:1px solid var(--border);border-radius:13px;z-index:120;overflow:hidden;animation:pop .16s ease;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.net-opt{display:flex;align-items:center;gap:11px;padding:11px 14px;width:100%;text-align:left;transition:background .12s}
.net-opt:hover{background:var(--hover)}
.net-opt + .net-opt{border-top:1px solid var(--border)}
.net-opt .net-ic{width:28px;height:28px;border-radius:8px}
.net-opt .net-ic svg{width:15px;height:15px}
.net-opt .nm{font-weight:600;font-size:13.5px}
.net-opt .ns{font-size:11px;color:var(--dim)}
.net-check{margin-left:auto;color:var(--accent)}

/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 15px;min-width:280px;max-width:360px;box-shadow:0 10px 34px rgba(0,0,0,.4);animation:tin .24s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .2s ease forwards}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}
.toast-ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;background:var(--ok-soft);color:var(--ok)}
.toast-ic svg{width:14px;height:14px}
.toast-t{font-size:13px;font-weight:600}
.toast-d{font-size:12px;color:var(--muted);margin-top:1px}


/* --- refinement pass additions --- */
.net-note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
.pill-logo,.chip-logo{width:18px;height:18px;display:inline-flex;flex-shrink:0}
.pill-logo svg,.chip-logo svg,.w-ic svg,.net-logo svg,.dd-logo svg,.wpop-badge svg{width:100%;height:100%;display:block}
.wallet-chip .chip-logo{width:20px;height:20px}
.net-logo{width:26px;height:26px;display:inline-flex;flex-shrink:0;border-radius:8px;overflow:hidden}
.net-logo.sm{width:18px;height:18px;border-radius:6px}
.dd-logo{width:30px;height:30px;border-radius:8px;overflow:hidden;flex-shrink:0}
.w-ic{overflow:hidden}
.readonly-net{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:13.5px;font-weight:500}
.ro-tag{margin-left:auto;font-size:11px;color:var(--dim);font-weight:500}
.wpop{max-width:340px}
.wpop-head{text-align:center;padding:24px 20px 18px;border-bottom:1px solid var(--border)}
.wpop-badge{width:46px;height:46px;margin:0 auto 13px;border-radius:13px;overflow:hidden}
.wpop-title{font-size:15px;font-weight:600}
.wpop-site{font-size:12.5px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.wpop-rows{padding:6px 20px}
.wpop-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:13px}
.wpop-row + .wpop-row{border-top:1px solid var(--border)}
.wpop-row .k{color:var(--muted)}
.wpop-row .v{font-weight:500;display:flex;align-items:center;gap:7px}
.wpop-actions{padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px}
.gh-lvl{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.gh-level{font-size:14px;font-weight:700}
.gh-title{font-size:12px;color:var(--muted)}
.gh-xp{font-size:11.5px;color:var(--dim);margin:10px 0 15px}
.gh-stats{display:flex;flex-direction:column}
.gh-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12.5px}
.gh-row + .gh-row{border-top:1px solid var(--border)}
.gh-row .k{color:var(--muted)}

// Only Base Sepolia has a deployed contract stack today. Robinhood Chain is listed but

  {id:'base',      name:'Base Sepolia',    logo:'base',      chainId:84532, live:true},
  {id:'robinhood', name:'Robinhood Chain', logo:'robinhood', chainId:4663,  live:false}

const WALLETS = [
  {id:'robinhood', name:'Robinhood Wallet', desc:'Connect using your Robinhood Wallet.', logo:'robinhood'},
  {id:'coinbase',  name:'Coinbase Wallet',  desc:'Connect using Coinbase Wallet.',        logo:'coinbase'},

let ACCOUNTS = [];
const LEVELS=[[50,'Legend'],[35,'Expert'],[20,'Architect'],[10,'Builder'],[5,'Contributor'],[1,'Member']];
const XP_PER_LEVEL=150;
function levelOf(xp){const l=Math.min(50,Math.floor(xp/XP_PER_LEVEL)+1);let t='Member';for(const[min,name]of LEVELS){if(l>=min){t=name;break}}return{level:l,title:t,into:xp%XP_PER_LEVEL,need:XP_PER_LEVEL}}

};
function totalDeploys(){return S.agentDeploys+S.contractDeploys}

/* Leaderboard: built from on-chain DeployManager events. Empty until builders act. */
let LB = { today:[], weekly:[], alltime:[] };
let LB_LOADED = false;
async function loadLeaderboard(){
  const c=dmRead(); if(!c) return;
  try{
    const [gms, cds, ads] = await Promise.all([
      c.queryFilter(c.filters.GMCompleted(), 0, 'latest').catch(()=>[]),
      c.queryFilter(c.filters.ContractDeployed(), 0, 'latest').catch(()=>[]),
      c.queryFilter(c.filters.AgentDeployed(), 0, 'latest').catch(()=>[])
    ]);
    const prov=readProvider(); const cache={};
    const day=async bn=>{ if(cache[bn]!=null) return cache[bn];
      try{ const b=await prov.getBlock(bn); cache[bn]=Math.floor(b.timestamp/86400); }catch(e){ cache[bn]=null; }
      return cache[bn]; };
    const users={};
    const touch=a=>{ a=a.toLowerCase(); if(!users[a]) users[a]={gm:new Set(), dep:new Set()}; return users[a]; };
    for(const e of gms){ const d=await day(e.blockNumber); if(d!=null) touch(e.args.builder).gm.add(d); }
    for(const e of [...cds,...ads]){ const d=await day(e.blockNumber); if(d!=null) touch(e.args.deployer).dep.add(d); }
    const today=Math.floor(Date.now()/86400000);
    const rows=Object.entries(users).map(([addr,u])=>{
      const xp=u.gm.size*10 + u.dep.size*100;
      let st=0,d=today; if(!u.gm.has(d)) d--; while(u.gm.has(d)){ st++; d--; }
      const lv=levelOf(xp).level;
      const activeToday=u.gm.has(today)||u.dep.has(today);
      const activeWeek=[...u.gm,...u.dep].some(x=>x>today-7);
      return {addr, xp, st, lv, activeToday, activeWeek};
    });
    const fmt=r=>[String(0), r.addr.slice(0,6)+'…'+r.addr.slice(-4), r.lv, r.xp, r.st];
    const rank=list=>list.sort((a,b)=>b.xp-a.xp).slice(0,10).map((r,i)=>{const o=fmt(r);o[0]=String(i+1);return o;});
    LB.alltime=rank([...rows]);
    LB.today=rank(rows.filter(r=>r.activeToday));
    LB.weekly=rank(rows.filter(r=>r.activeWeek));
    LB_LOADED=true; render();
  }catch(e){ LB_LOADED=true; }
}

/* ============================ CHAIN (real) ============================ */
const CFG = () => window.CG_STUDIO_CONFIG || {};
const K = s => ethers.keccak256(ethers.toUtf8Bytes(s));
const ACTION = { GM:'GM', AGENT:'DEPLOY_AGENT', CONTRACT:'DEPLOY_CONTRACT' };

function dmAddr(){ const d=(CFG().deployManager||{}).base||{}; return d.address||null; }
function fmAddr(){ return (CFG().feeManager||{}).address||null; }
function rpcUrl(){ const r=CFG().rpc||{}; return r.baseSepolia||r.base; }
function readProvider(){ return new ethers.JsonRpcProvider(rpcUrl()); }
function dmRead(){ const a=dmAddr(); return a?new ethers.Contract(a, CFG().deployManagerAbi, readProvider()):null; }
function fmRead(){ const a=fmAddr(); return a?new ethers.Contract(a, CFG().feeManagerAbi, readProvider()):null; }
async function dmWrite(){
  if(!S.provider) throw new Error('Connect your wallet first');
  const bp=new ethers.BrowserProvider(S.provider);
  return new ethers.Contract(dmAddr(), CFG().deployManagerAbi, await bp.getSigner());
}

// EIP-6963 wallet discovery
const DISCOVERED = [];
window.addEventListener('eip6963:announceProvider', e => {
  if(!DISCOVERED.find(p=>p.info.uuid===e.detail.info.uuid)) DISCOVERED.push(e.detail);
});
try{ window.dispatchEvent(new Event('eip6963:requestProvider')); }catch(e){}
function findProvider(walletId){
  const want={robinhood:['robinhood'],coinbase:['coinbase'],rabby:['rabby'],metamask:['metamask']}[walletId]||[];
  const hit=DISCOVERED.find(p=>want.some(w=>(p.info.rdns||'').toLowerCase().includes(w)||(p.info.name||'').toLowerCase().includes(w)));
  if(hit) return hit.provider;
  if(walletId==='metamask' && window.ethereum && window.ethereum.isMetaMask) return window.ethereum;
  return null;
}

// Fees: USD label from FeeManager, exact wei from DeployManager.quote(). No math here.
async function loadFees(){
  const c=fmRead(); if(!c) return;
  for(const [k,name] of Object.entries(ACTION)){
    try{ const v=await c.feeUsdOf(K(name)); S.fees[name]=Number(v)/1e8; }catch(e){}
  }
  render();
}
function feeLabel(action){ const u=S.fees[action]; return (u==null)?'':('$'+u.toFixed(2)); }
async function quoteWei(action){
  const c=dmRead(); if(!c) throw new Error('Studio contracts unavailable');
  const q=await c.quote(K(action));
  return (q[0]*110n)/100n;   // small buffer; DeployManager refunds the excess on-chain
}
async function ensureChain(){
  const n=NETWORKS.find(x=>x.id===S.network);
  const want='0x'+n.chainId.toString(16);
  const cur=await S.provider.request({method:'eth_chainId'});
  if(cur===want) return;
  try{ await S.provider.request({method:'wallet_switchEthereumChain',params:[{chainId:want}]}); }
  catch(err){
    if(err && err.code===4902){
      await S.provider.request({method:'wallet_addEthereumChain',params:[{
        chainId:want, chainName:n.name, rpcUrls:[rpcUrl()],
        nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18}
      }]});
    } else throw err;
  }
}
function explorerTx(h){ return 'https://sepolia.basescan.org/tx/'+h; }
function explorerAddr(a){ return 'https://sepolia.basescan.org/address/'+a; }

// Builder profile from on-chain events. Events are the source of truth; no backend.
async function loadProfile(){
  if(!S.connected) return;
  const c=dmRead(); if(!c) return;
  S.loadingProfile=true;
  try{
    const me=S.account.full;
    const [gms, cds, ads] = await Promise.all([
      c.queryFilter(c.filters.GMCompleted(me), 0, 'latest').catch(()=>[]),
      c.queryFilter(c.filters.ContractDeployed(null, me), 0, 'latest').catch(()=>[]),
      c.queryFilter(c.filters.AgentDeployed(me), 0, 'latest').catch(()=>[])
    ]);
    S.lifetimeGMs=gms.length; S.contractDeploys=cds.length; S.agentDeploys=ads.length;

    // group by UTC day for XP + streak (matches the documented rules)
    const prov=readProvider(); const blockDay={};
    const stamp=async(bn)=>{ if(blockDay[bn]!=null) return blockDay[bn];
      try{ const b=await prov.getBlock(bn); blockDay[bn]=Math.floor(b.timestamp/86400); }catch(e){ blockDay[bn]=null; }
      return blockDay[bn]; };
    const gmDays=new Set(), depDays=new Set();
    for(const e of gms){ const d=await stamp(e.blockNumber); if(d!=null) gmDays.add(d); }
    for(const e of [...cds,...ads]){ const d=await stamp(e.blockNumber); if(d!=null) depDays.add(d); }
    S.xp = gmDays.size*10 + depDays.size*100;

    const today=Math.floor(Date.now()/86400000);
    S.gmClaimed = gmDays.has(today);
    S.deployClaimed = depDays.has(today);
    S.gm.base = S.gmClaimed;
    S.xpToday = (S.gmClaimed?10:0) + (S.deployClaimed?100:0);
    let streak=0, d=today;
    if(!gmDays.has(d)) d--;              // streak survives until today's window closes
    while(gmDays.has(d)){ streak++; d--; }
    S.streak=streak;
  }catch(e){ /* profile stays at zero rather than showing invented numbers */ }
  S.loadingProfile=false; render();
}

function toast(title, desc){
  const t=document.createElement('div'); t.className='toast';

  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),200)},3200);
}

function renderTop(){
  $('#netpill').innerHTML=`<span class="pill-logo">${lg(net().logo)}</span>${net().name}${ic('chev')}`;
  const wa=$('#walletarea');
  if(!S.connected){

/* ============================ ACTIONS ============================ */
async function doGM(netId){
  if(!S.connected){ walletModal(); return; }
  const n=NETWORKS.find(x=>x.id===netId);
  if(!n.live){ toast(n.name+' is not live yet','Studio contracts are not deployed there.'); return; }
  try{
    await ensureChain();
    const value=await quoteWei(ACTION.GM);
    const c=await dmWrite();
    toast('Confirm in your wallet','Daily GM · '+feeLabel(ACTION.GM));
    const tx=await c.pay(K(ACTION.GM), { value });
    await tx.wait();
    const first=!S.gmClaimed;
    await loadProfile();
    toast('GM completed successfully', first?'+10 XP awarded.':'XP already claimed today.');
  }catch(err){
    toast((err&&err.code===4001)?'GM cancelled':'GM failed', (err&&(err.shortMessage||err.message))||'');
  }
}

    const name=v('f_name'), sym=v('f_symbol'), sup=v('f_supply').replace(/,/g,''), dec=v('f_decimals')||'18';
    if(!name) return {err:'Enter a token name'};
    if(!sym) return {err:'Enter a token symbol'};
    if(!/^\d+$/.test(sup)||BigInt(sup)<=0n) return {err:'Total supply must be a whole number above 0'};
    const d=Number(dec), min=(kindStr==='B20')?6:0;
    if(!Number.isInteger(d)||d<min||d>18) return {err:'Decimals must be between '+min+' and 18'};
    return {values:[name, sym, sup, d]};
  }
  if(kindStr==='ERC721'){
    const name=v('f_name'), sym=v('f_symbol'), uri=v('f_uri'), max=(v('f_max')||'0').replace(/,/g,'');
    if(!name) return {err:'Enter a collection name'};
    if(!sym) return {err:'Enter a symbol'};
    if(!/^\d+$/.test(max)) return {err:'Max supply must be a whole number'};
    return {values:[name, sym, uri, max]};
  }
  if(kindStr==='ERC1155'){
    const name=v('f_name'), uri=v('f_uri');
    if(!name) return {err:'Enter a collection name'};
    return {values:[name, uri]};
  }
  const uri=v('f_uri')||('https://coingyaan.com/agent/'+(v('f_name')||'agent').toLowerCase().replace(/[^a-z0-9]+/g,'-'));
  if(!v('f_name')) return {err:'Enter an agent name'};
  return {values:[uri]};
}

async function runDeploy(kind){
  if(!S.connected){ walletModal(); return; }
  const n=NETWORKS.find(x=>x.id===S.network);
  if(!n.live){ toast(n.name+' is not live yet','Studio contracts are not deployed there.'); return; }
  const kindStr = kind==='agent' ? 'ERC8004' : S.contractType;
  if(kindStr==='B20'){ toast('B20 is not enabled yet','The B20 factory is not deployed.'); return; }

  const got=collectValues(kindStr);
  if(got.err){ toast(got.err); return; }

  const panelSel = kind==='agent' ? '#agent-panel' : '#contract-panel';
  const panel=$(panelSel); if(!panel) return;
  panel.innerHTML=`<div class="state"><div class="state-ic load"><div class="spin"></div></div><h4>Deploying…</h4><p>Confirm the transaction in your wallet.</p></div>`;
  try{
    await ensureChain();
    const action = (kindStr==='ERC8004') ? ACTION.AGENT : ACTION.CONTRACT;
    const value = await quoteWei(action);
    const c = await dmWrite();
    const types = (CFG().paramSchema||{})[kindStr];
    const params = ethers.AbiCoder.defaultAbiCoder().encode(types, got.values);
    const tx = await c.deploy(K(kindStr), params, { value });
    panel.innerHTML=`<div class="state"><div class="state-ic load"><div class="spin"></div></div><h4>Deploying…</h4><p>Transaction sent. Waiting for confirmation.</p></div>`;
    const rc = await tx.wait();
    let addr=null;
    for(const log of rc.logs){
      try{ const p=c.interface.parseLog(log);
        if(p && (p.name==='ContractDeployed'||p.name==='AgentDeployed')){ addr=p.args.contractAddress; break; }
      }catch(e){}
    }
    const first = !S.deployClaimed;
    await loadProfile();
    panel.innerHTML=`<div class="state"><div class="state-ic ok">${ic('check')}</div><h4>Deployment completed successfully</h4><p>${kind==='agent'?'Your agent is live':'Your contract is live'} on ${net().name}. ${first?'+100 XP awarded.':'XP already claimed today.'}</p>
      <div class="result">
        <div class="result-row"><span class="k">${kind==='agent'?'Agent registry':'Contract address'}</span><span class="v">${addr?addr.slice(0,10)+'…'+addr.slice(-6):'see transaction'}</span></div>
        <div class="result-row"><span class="k">Transaction</span><span class="v">${rc.hash.slice(0,10)}…${rc.hash.slice(-6)}</span></div>
        <div class="result-row"><span class="k">Network</span><span class="v">${net().name}</span></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px">
        ${addr?`<a class="btn btn-secondary btn-sm" target="_blank" href="${explorerAddr(addr)}">${ic('ext')}View contract</a>`:''}
        <a class="btn btn-secondary btn-sm" target="_blank" href="${explorerTx(rc.hash)}">${ic('ext')}View transaction</a>
        <button class="btn btn-secondary btn-sm" data-act="${kind==='agent'?'agent-tab:deploy':'contract-type:'+S.contractType}">Deploy another</button>
      </div></div>`;
    toast('Deployment completed successfully', (kind==='agent'?'Agent':'Contract')+' deployed on '+net().name);
  }catch(err){
    panel.innerHTML = kind==='agent' ? agentPanel() : contractPanel();
    toast((err&&err.code===4001)?'Deployment rejected':'Deploy failed', (err&&(err.shortMessage||err.message))||'');
  }
}

/* ============================ EVENT DELEGATION ============================ */
document.addEventListener('click', e=>{
  const stop=e.target.closest('[data-stop]');
  const el=e.target.closest('[data-act]');
  if(!el){ return; }
  const act=el.getAttribute('data-act');
  // clicks inside a modal card shouldn't close via card; only overlay closes
  if(act==='close-layer'){ if(e.target.closest('[data-stop]')) return; closeLayer(); return; }
  const [k,v]=act.split(':');

  switch(k){
    case 'dd-close': closeLayer(); break;
    case 'nav': S.view=v; closeLayer(); render(); break;
    case 'connect': walletModal(); break;
    case 'pick': S.walletId=v; S.walletName=WALLETS.find(w=>w.id===v).name; closeLayer(); walletPopup(v); break;
    case 'wconnect': connectFromPopup(v); break;
    case 'cancel': closeLayer(); break;
    case 'copyaddr': try{navigator.clipboard&&navigator.clipboard.writeText(S.account.addr)}catch(e){}; toast('Address copied'); closeLayer(); break;
    case 'profile': closeLayer(); toast('Builder profile','Shown in the sidebar.'); break;
    case 'acct': connectAccount(+v); break;
    case 'wallet-menu': S.ddOpen?closeLayer():walletDropdown(); break;
    case 'switch': closeLayer(); walletModal(); break;
    case 'reconnect': closeLayer(); walletModal(); break;
    case 'disconnect': disconnect(); break;
    case 'net-toggle': S.netOpen?closeLayer():netMenu(); break;
    case 'setnet': {
      const n=NETWORKS.find(x=>x.id===v);
      if(!n.live){ closeLayer(); toast(n.name+' is not live yet','Studio contracts are not deployed there.'); break; }
      S.network=v; closeLayer(); render(); toast('Network switched','Now viewing '+net().name+'.');
      if(S.connected) ensureChain().catch(()=>toast('Switch network in your wallet'));
      break;
    }
    case 'gm': doGM(v); break;
    case 'lb': S.lbTab=v; render(); break;
    case 'agent-tab': S.agentTab=v; closeLayer(); $('#agent-panel').innerHTML=agentPanel(); document.querySelectorAll('[data-act^="agent-tab"]').forEach(x=>{}); render(); break;
    case 'contract-type': S.contractType=v; render(); break;
    case 'deploy': runDeploy(v); break;
    case 'docs': S.docsPage=v; render(); break;
    case 'chip': el.classList.toggle('on'); break;
    default: break;
  }
});

/* countdown to next UTC midnight */
function tick(){
  const el=document.getElementById('countdown'); if(!el) return;
  const now=new Date();
  const next=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+1,0,0,0));
  let s=Math.max(0,Math.floor((next-now)/1000));
  const h=String(Math.floor(s/3600)).padStart(2,'0'); s%=3600;
  const m=String(Math.floor(s/60)).padStart(2,'0');
  const ss=String(s%60).padStart(2,'0');
  el.textContent=`${h}:${m}:${ss}`;
}
setInterval(tick,1000);

/* boot */
// deep link from the landing: /studio/app?view=contracts
try{
  const v=new URLSearchParams(location.search).get('view');
  if(v && ['gm','agents','contracts','explorer','docs'].includes(v)) S.view=v;
}catch(e){}
render(); tick();
loadFees();          // fees load from FeeManager over public RPC, no wallet needed
loadLeaderboard();   // builder activity from on-chain events
</script>
