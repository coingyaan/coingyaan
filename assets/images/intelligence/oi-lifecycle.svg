<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Lifecycle of open interest: a long and a short open a new contract, open interest rises by one, the contract stays active, then the position closes and open interest falls by one">
<rect width="900" height="300" rx="16" fill="#0b1424"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">
<g>
<rect x="30" y="70" width="150" height="70" rx="10" fill="#0e2233" stroke="#22d3ee" stroke-opacity=".4"/>
<text x="105" y="100" text-anchor="middle" fill="#e6ebf5">Trader A</text>
<text x="105" y="122" text-anchor="middle" fill="#22d3ee" font-size="12">opens LONG</text>
<rect x="30" y="160" width="150" height="70" rx="10" fill="#221016" stroke="#f87171" stroke-opacity=".4"/>
<text x="105" y="190" text-anchor="middle" fill="#e6ebf5">Trader B</text>
<text x="105" y="212" text-anchor="middle" fill="#f87171" font-size="12">opens SHORT</text>
</g>
<path d="M180 105 L240 150 M180 195 L240 150" fill="none" stroke="#1e3048" stroke-width="2"/>
<rect x="240" y="115" width="170" height="70" rx="10" fill="#101d30" stroke="#1e3048"/>
<text x="325" y="145" text-anchor="middle" fill="#e6ebf5">New Contract</text>
<text x="325" y="167" text-anchor="middle" fill="#94a3b8" font-size="12">created</text>
<path d="M410 150 L470 150" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="470" y="115" width="150" height="70" rx="10" fill="#0e2233" stroke="#22d3ee" stroke-opacity=".5"/>
<text x="545" y="145" text-anchor="middle" fill="#22d3ee" font-size="19" font-weight="800">OI +1</text>
<text x="545" y="167" text-anchor="middle" fill="#94a3b8" font-size="11">contract active</text>
<path d="M620 150 L680 150" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="680" y="115" width="190" height="70" rx="10" fill="#141414" stroke="#f59e0b" stroke-opacity=".4"/>
<text x="775" y="140" text-anchor="middle" fill="#f59e0b" font-size="12">position closed</text>
<text x="775" y="164" text-anchor="middle" fill="#e6ebf5" font-size="18" font-weight="800">OI -1</text>
<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#64748b"/></marker></defs>
</g>
</svg>
