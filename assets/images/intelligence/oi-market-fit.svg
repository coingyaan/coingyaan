<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="How open interest fits into the crypto market: the spot market shows price while the derivatives market shows open interest, which professional traders read as market sentiment, liquidity, trend strength and risk">
<rect width="900" height="460" rx="16" fill="#0b1424"/>
<g font-family="Inter, Arial, sans-serif">
<rect x="60" y="50" width="330" height="120" rx="12" fill="#101d30" stroke="#1e3048"/>
<text x="225" y="88" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.5">SPOT MARKET</text>
<text x="225" y="128" text-anchor="middle" fill="#e6ebf5" font-size="22" font-weight="800">Bitcoin Price</text>
<text x="225" y="152" text-anchor="middle" fill="#64748b" font-size="12">what the market did</text>
<rect x="510" y="50" width="330" height="120" rx="12" fill="#0e2233" stroke="#22d3ee" stroke-opacity=".4"/>
<text x="675" y="88" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="1.5">DERIVATIVES MARKET</text>
<text x="675" y="128" text-anchor="middle" fill="#e6ebf5" font-size="22" font-weight="800">Open Interest</text>
<text x="675" y="152" text-anchor="middle" fill="#64748b" font-size="12">how much is committed</text>
<path d="M225 170 L225 220 L450 220 L450 250" fill="none" stroke="#1e3048" stroke-width="2"/>
<path d="M675 170 L675 220 L450 220" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".6"/>
<rect x="300" y="250" width="300" height="60" rx="12" fill="#141414" stroke="#f59e0b" stroke-opacity=".4"/>
<text x="450" y="287" text-anchor="middle" fill="#f59e0b" font-size="16" font-weight="800">Professional Traders</text>
<g>
<rect x="70" y="350" width="180" height="70" rx="10" fill="#101d30" stroke="#1e3048"/>
<text x="160" y="392" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">Market Sentiment</text>
<rect x="270" y="350" width="150" height="70" rx="10" fill="#101d30" stroke="#1e3048"/>
<text x="345" y="392" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">Liquidity</text>
<rect x="440" y="350" width="180" height="70" rx="10" fill="#101d30" stroke="#1e3048"/>
<text x="530" y="392" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">Trend Strength</text>
<rect x="640" y="350" width="190" height="70" rx="10" fill="#101d30" stroke="#1e3048"/>
<text x="735" y="392" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">Risk Analysis</text>
</g>
<path d="M450 310 L450 330 L160 330 L160 350 M450 330 L345 330 L345 350 M450 330 L530 330 L530 350 M450 330 L735 330 L735 350" fill="none" stroke="#1e3048" stroke-width="2"/>
</g>
</svg>
