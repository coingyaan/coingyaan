<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="The five Fear and Greed zones from extreme fear at 0 through neutral in the middle to extreme greed at 100">
<rect width="640" height="190" rx="16" fill="#0b1424"/>
<defs><linearGradient id="fgbar" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ea3943"/><stop offset="30%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#eab308"/><stop offset="70%" stop-color="#84cc16"/><stop offset="100%" stop-color="#16c784"/></linearGradient></defs>
<g font-family="Inter, Arial, sans-serif" text-anchor="middle">
<text x="320" y="34" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.2">THE FIVE SENTIMENT ZONES</text>
<rect x="40" y="58" width="560" height="26" rx="13" fill="url(#fgbar)"/>
<g stroke="#0b1424" stroke-width="2"><path d="M152 58 V84"/><path d="M264 58 V84"/><path d="M376 58 V84"/><path d="M488 58 V84"/></g>
