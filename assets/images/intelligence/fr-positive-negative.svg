<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="Positive funding: longs pay shorts when the perpetual price is above spot. Negative funding: shorts pay longs when the perpetual price is below spot">
<rect width="860" height="320" rx="16" fill="#0b1424"/>
<g font-family="Inter, Arial, sans-serif">
<rect x="30" y="30" width="380" height="260" rx="14" fill="#0e1c2e" stroke="#38bdf8" stroke-opacity=".35"/>
<text x="220" y="66" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800">POSITIVE FUNDING</text>
<text x="220" y="94" text-anchor="middle" fill="#64748b" font-size="12">perpetual price above spot</text>
<rect x="70" y="130" width="110" height="60" rx="10" fill="#101d30" stroke="#1e3048"/><text x="125" y="166" text-anchor="middle" fill="#e6ebf5" font-size="15" font-weight="700">Longs</text>
<rect x="260" y="130" width="110" height="60" rx="10" fill="#101d30" stroke="#1e3048"/><text x="315" y="166" text-anchor="middle" fill="#e6ebf5" font-size="15" font-weight="700">Shorts</text>
<path d="M180 160 H255" stroke="#38bdf8" stroke-width="3" marker-end="url(#fra)"/>
<text x="220" y="222" text-anchor="middle" fill="#94a3b8" font-size="12.5">funding payment</text>
<rect x="450" y="30" width="380" height="260" rx="14" fill="#231a10" stroke="#f59e0b" stroke-opacity=".35"/>
<text x="640" y="66" text-anchor="middle" fill="#f59e0b" font-size="16" font-weight="800">NEGATIVE FUNDING</text>
<text x="640" y="94" text-anchor="middle" fill="#64748b" font-size="12">perpetual price below spot</text>
<rect x="490" y="130" width="110" height="60" rx="10" fill="#101d30" stroke="#1e3048"/><text x="545" y="166" text-anchor="middle" fill="#e6ebf5" font-size="15" font-weight="700">Shorts</text>
<rect x="680" y="130" width="110" height="60" rx="10" fill="#101d30" stroke="#1e3048"/><text x="735" y="166" text-anchor="middle" fill="#e6ebf5" font-size="15" font-weight="700">Longs</text>
<path d="M600 160 H675" stroke="#f59e0b" stroke-width="3" marker-end="url(#frb)"/>
<text x="640" y="222" text-anchor="middle" fill="#94a3b8" font-size="12.5">funding payment</text>
<defs>
<marker id="fra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#38bdf8"/></marker>
<marker id="frb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#f59e0b"/></marker>
</defs>
</g>
</svg>
