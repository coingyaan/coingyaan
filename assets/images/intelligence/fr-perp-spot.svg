<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-label="How funding keeps perpetual futures near spot: spot price and perpetual futures price create a price difference, the funding mechanism creates an incentive for traders, and the perpetual price moves back toward spot">
<rect width="520" height="470" rx="16" fill="#0b1424"/>
<g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
<rect x="150" y="24" width="220" height="48" rx="10" fill="#101d30" stroke="#1e3048"/><text x="260" y="53" fill="#e6ebf5">Spot Price</text>
<rect x="150" y="96" width="220" height="48" rx="10" fill="#0e2233" stroke="#38bdf8" stroke-opacity=".4"/><text x="260" y="125" fill="#38bdf8">Perpetual Futures Price</text>
<rect x="150" y="168" width="220" height="48" rx="10" fill="#101d30" stroke="#1e3048"/><text x="260" y="197" fill="#cbd5e1">Price Difference</text>
<rect x="130" y="240" width="260" height="48" rx="10" fill="#141414" stroke="#f59e0b" stroke-opacity=".45"/><text x="260" y="269" fill="#f59e0b">Funding Mechanism</text>
<rect x="150" y="312" width="220" height="48" rx="10" fill="#101d30" stroke="#1e3048"/><text x="260" y="341" fill="#cbd5e1">Incentive for Traders</text>
<rect x="110" y="392" width="300" height="52" rx="10" fill="#0e2233" stroke="#38bdf8" stroke-opacity=".4"/><text x="260" y="416" fill="#38bdf8" font-size="14">Perpetual Price Moves</text><text x="260" y="434" fill="#38bdf8" font-size="14">Toward Spot</text>
<g stroke="#334155" stroke-width="2"><path d="M260 72 V96"/><path d="M260 144 V168"/><path d="M260 216 V240"/><path d="M260 288 V312"/><path d="M260 360 V392"/></g>
</g>
</svg>
