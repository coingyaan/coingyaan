<g><line x1="380" y1="332" x2="380" y2="430" stroke="#1e3048" stroke-width="2"/><rect x="305" y="430" width="150" height="44" rx="9" fill="#101d30" stroke="#1e3048"/><text x="380" y="457" fill="#cbd5e1">ETF Flows</text></g>
