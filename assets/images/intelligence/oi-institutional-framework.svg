<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="Institutional decision framework: a central market decision draws on price, open interest, volume, funding rates, ETF flows, stablecoin supply, exchange flows and on-chain activity">
