<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Rollout capacity: the initial stage allows 100 concurrent outcomes and 500 deployments per day, the planned expansion raises this to 1000 concurrent outcomes and 5000 deployments per day">
<rect width="640" height="250" rx="16" fill="#0b1424"/>
<g font-family="Inter, Arial, sans-serif" text-anchor="middle">
<text x="320" y="36" fill="#97fce4" font-size="13" font-weight="700" letter-spacing="1.2">PLANNED HIP-4 CAPACITY</text>
<g>
<rect x="46" y="64" width="250" height="150" rx="12" fill="#101d30" stroke="#1e3048"/>
<text x="171" y="94" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">INITIAL</text>
<text x="171" y="138" fill="#e6ebf5" font-size="30" font-weight="800">100</text><text x="171" y="158" fill="#94a3b8" font-size="12">concurrent outcomes</text>
<text x="171" y="188" fill="#cbd5e1" font-size="17" font-weight="700">500 / day</text><text x="171" y="204" fill="#64748b" font-size="11">deployments</text>
</g>
<g>
<rect x="344" y="64" width="250" height="150" rx="12" fill="#0e1f18" stroke="#16c784" stroke-opacity=".4"/>
<text x="469" y="94" fill="#16c784" font-size="12" font-weight="700" letter-spacing="1">PLANNED EXPANSION</text>
<text x="469" y="138" fill="#e6ebf5" font-size="30" font-weight="800">1,000</text><text x="469" y="158" fill="#94a3b8" font-size="12">concurrent outcomes</text>
<text x="469" y="188" fill="#5eead4" font-size="17" font-weight="700">5,000 / day</text><text x="469" y="204" fill="#64748b" font-size="11">deployments</text>
</g>
<path d="M300 139 H340" stroke="#334155" stroke-width="2" marker-end="url(#ah3)"/>
</g>
<defs><marker id="ah3" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#334155"/></marker></defs>
</svg>
