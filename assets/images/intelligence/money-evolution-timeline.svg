<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" width="100%" font-family="Inter, Arial, sans-serif" role="img" aria-label="The evolution of digital money: cash, bank transfers, online payments, stablecoins, tokenized assets, future digital economy">
  <defs><linearGradient id="w5bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f1a2b"/><stop offset="100%" stop-color="#0b1424"/></linearGradient>
  <linearGradient id="w5line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#16c784"/></linearGradient></defs>
  <rect x="1" y="1" width="1118" height="248" rx="16" fill="url(#w5bg)" stroke="#1e3048"/>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="2" fill="#8a94a6" font-family="JetBrains Mono, monospace">THE EVOLUTION OF DIGITAL MONEY</text>
  <line x1="95" y1="130" x2="1025" y2="130" stroke="url(#w5line)" stroke-width="3"/>
  <g text-anchor="middle">
    <g transform="translate(110 130)"><circle r="9" fill="#0c1626" stroke="#475569" stroke-width="3"/><text y="-22" font-size="14" font-weight="700" fill="#94a3b8">Cash</text></g>
    <g transform="translate(293 130)"><circle r="9" fill="#0c1626" stroke="#64748b" stroke-width="3"/><text y="-22" font-size="13.5" font-weight="700" fill="#a9b4c4">Bank Transfers</text></g>
    <g transform="translate(476 130)"><circle r="9" fill="#0c1626" stroke="#3b82f6" stroke-width="3"/><text y="-22" font-size="13.5" font-weight="700" fill="#cbd5e1">Online Payments</text></g>
    <g transform="translate(659 130)"><circle r="11" fill="#16c784" stroke="#0b1424" stroke-width="3"/><text y="-22" font-size="15" font-weight="800" fill="#16c784">Stablecoins</text><text y="42" font-size="12" fill="#8a94a6">Today</text></g>
    <g transform="translate(842 130)"><circle r="9" fill="#0c1626" stroke="#3b82f6" stroke-width="3"/><text y="-22" font-size="13.5" font-weight="700" fill="#cbd5e1">Tokenized Assets</text></g>
    <g transform="translate(1010 130)"><circle r="9" fill="#0c1626" stroke="#475569" stroke-width="3"/><text y="-22" font-size="13" font-weight="700" fill="#94a3b8">Future Digital</text><text y="42" font-size="12" fill="#8a94a6">Economy</text></g>
  </g>
  <text x="560" y="212" text-anchor="middle" font-size="12" fill="#6b7688">Stablecoins mark the current step from legacy money toward fully tokenized finance.</text>
</svg>
